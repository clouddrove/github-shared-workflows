---
# Reusable Smurf SELM workflow — lint, template, deploy, and rollback Helm charts.
# Docs: docs/helm-smurf.md
name: ⎈ Smurf Helm Shared Workflow

on:
  workflow_call:
    inputs:
      # ── Cloud provider ───────────────────────────────────────────────
      provider:
        description: Cloud provider (aws, gcp, azure)
        type: string
        required: false
        default: aws
      target_environment:
        description: GitHub Environment name (empty = no gate)
        type: string
        required: false
        default: ""
      smurf_version:
        description: Smurf CLI version
        type: string
        required: false
        default: v1.1.5

      # ── AWS ──────────────────────────────────────────────────────────
      aws_region:
        description: AWS region
        type: string
        required: false
        default: us-east-1
      aws_eks_cluster_name:
        description: AWS EKS cluster name
        type: string
        required: false
      aws_assume_role:
        description: Assume another IAM role after initial AWS auth
        type: boolean
        required: false
        default: false
      aws_assume_role_arn:
        description: IAM role ARN to assume
        type: string
        required: false

      # ── GCP ──────────────────────────────────────────────────────────
      gcp_project_id:
        description: GCP project ID
        type: string
        required: false
      gcp_region:
        description: GCP region
        type: string
        required: false
        default: us-central1
      gcp_gke_cluster_name:
        description: GKE cluster name
        type: string
        required: false

      # ── Helm toggles ─────────────────────────────────────────────────
      helm_enable:
        description: Run lint + deploy jobs
        type: boolean
        required: false
        default: false
      helm_rollback_enable:
        description: Run helm rollback job
        type: boolean
        required: false
        default: false

      # ── Helm chart & release ─────────────────────────────────────────
      helm_release_name:
        description: Helm release name
        type: string
        required: false
      helm_chart_directory:
        description: Path to Helm chart directory
        type: string
        required: false
      helm_values_file_path:
        description: Values file path (relative to repo root)
        type: string
        required: false
      helm_namespace:
        description: Kubernetes namespace
        type: string
        required: false
        default: default
      helm_revision:
        description: Revision number for rollback
        type: string
        required: false
      helm_timeout:
        description: Helm install/upgrade timeout (e.g. 5m, 300s)
        type: string
        required: false
        default: 5m
      helm_flags:
        description: Extra flags for helm upgrade --install
        type: string
        required: false
        default: "--atomic --wait --create-namespace"

      # ── Helm plugins & repos ─────────────────────────────────────────
      helm_plugin_install:
        description: Install Helm plugins before deploy
        type: boolean
        required: false
        default: false
      helm_plugins:
        description: Helm plugin install command args
        type: string
        required: false
      helm_repo_add:
        description: Add Helm repo before deploy
        type: boolean
        required: false
        default: false
      helm_repository:
        description: Helm repository name
        type: string
        required: false
      helm_repository_url:
        description: Helm repository URL
        type: string
        required: false

    secrets:
      # ── AWS secrets ──────────────────────────────────────────────────
      AWS_ACCESS_KEY_ID:
        required: false
        description: AWS access key (keys auth)
      AWS_SECRET_ACCESS_KEY:
        required: false
        description: AWS secret key (keys auth)
      AWS_SESSION_TOKEN:
        required: false
        description: AWS session token (optional)
      BUILD_ROLE:
        required: false
        description: AWS OIDC role ARN

      # ── GCP secrets ──────────────────────────────────────────────────
      GCP_CREDENTIALS:
        required: false
        description: GCP service account JSON key
      WORKLOAD_IDENTITY_PROVIDER:
        required: false
        description: GCP workload identity provider
      SERVICE_ACCOUNT:
        required: false
        description: GCP service account email (WIP auth)
      GCP_PROJECT_ID:
        description: 'GCP Project ID'
        required: false

      # ── Azure secrets ────────────────────────────────────────────────
      AZURE_CREDENTIALS:
        required: false
        description: Azure service principal JSON

      helm_extra_args:
        required: false
        description: Extra helm CLI args (e.g. --set key=val)

permissions:
  id-token: write
  contents: read

jobs:
  ###############################################
  # LINT → TEMPLATE
  ###############################################
  helm-lint:
    name: Helm Lint & Template
    if: ${{ inputs.helm_enable }}
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.5
        with:
          version: ${{ inputs.smurf_version }}

      - name: ✅ Helm Lint
        run: |
          smurf selm lint "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}"

      - name: 📄 Helm Template
        run: |
          smurf selm template "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}"

  ###############################################
  # AUTH → KUBECONFIG → DEPLOY
  ###############################################
  helm-deploy:
    name: Helm Deploy
    if: ${{ inputs.helm_enable }}
    needs: helm-lint
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.5
        with:
          version: ${{ inputs.smurf_version }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Configure AWS credentials
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 Assume another IAM role
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: ☁️ Authenticate to Google Cloud
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ inputs.gcp_project_id }}

      - name: 🛠️ Set up gcloud SDK
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project_id }}
          install_components: gke-gcloud-auth-plugin

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials \
            "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: 🔵 Login to Azure
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔧 Update kubeconfig (EKS)
        if: ${{ inputs.provider == 'aws' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.aws_eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      # ── Helm plugins & repos ─────────────────────────────────────────
      - name: 🔌 Helm Plugin
        if: ${{ inputs.helm_plugin_install }}
        run: smurf selm plugin ${{ inputs.helm_plugins }}

      - name: 📚 Add Helm Chart Repo
        if: ${{ inputs.helm_repo_add }}
        run: |
          smurf selm repo add "${{ inputs.helm_repository }}" "${{ inputs.helm_repository_url }}"

      - name: 🔄 Update Helm Chart Repos
        if: ${{ inputs.helm_repo_add }}
        run: smurf selm repo update

      - name: 🚀 Helm Deploy
        run: |
          smurf selm upgrade --install \
            "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}" \
            -n "${{ inputs.helm_namespace }}" \
            --timeout "${{ inputs.helm_timeout }}" \
            ${{ inputs.helm_flags }} \
            ${{ secrets.helm_extra_args }}

  ###############################################
  # AUTH → KUBECONFIG → ROLLBACK
  ###############################################
  helm-rollback:
    name: Helm Rollback
    if: ${{ inputs.helm_rollback_enable }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v6

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.5
        with:
          version: ${{ inputs.smurf_version }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Configure AWS credentials
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 Assume another IAM role
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: ☁️ Authenticate to Google Cloud
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ inputs.gcp_project_id }}

      - name: 🛠️ Set up gcloud SDK
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.gcp_project_id }}
          install_components: gke-gcloud-auth-plugin

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials \
            "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: 🔵 Login to Azure
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔧 Update kubeconfig (EKS)
        if: ${{ inputs.provider == 'aws' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.aws_eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: ⏪ Helm Rollback
        run: |
          smurf selm rollback "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_revision }}" \
            -n "${{ inputs.helm_namespace }}"
