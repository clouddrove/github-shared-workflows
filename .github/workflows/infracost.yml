---
name: 💸 Infracost Analysis
on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        description: Working directory of terraform resources
        type: string
        default: ./
      slack_notification:
        description: Slack notification required or not
        type: string
        default: false
    secrets:
      INFRACOST_API_KEY:
        required: true
        description: Provide Key from infracost api
      GITHUB:
        required: true
        description: GitHub token.
      SLACK_WEBHOOK:
        required: false
        description: Slack webhook url
jobs:
  infracost:
    name: 💸 Infracost Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Setup Infracost
        uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: 📦 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: 🐞 Print debug info
        run: |
          echo "github base branch is ${{ github.event.pull_request.base.ref }}"
          echo "github.event.pull_request.number is ${{ github.event.pull_request.number }}"

      - name: 🧮 Generate Infracost cost estimate baseline
        run: |
          export INFRACOST_API_KEY=${{ secrets.INFRACOST_API_KEY }}
          cd ${{ inputs.working-directory }}
          infracost breakdown --path . \
                              --format=json \
                              --out-file=/tmp/infracost-base.json

      - name: 📦 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔀 Generate Infracost diff
        run: |
          export INFRACOST_API_KEY=${{ secrets.INFRACOST_API_KEY }}
          cd ${{ inputs.working-directory }}
          infracost diff --path=. \
                          --format=json \
                          --show-skipped \
                          --compare-to=/tmp/infracost-base.json \
                          --out-file=/tmp/infracost.json

      - name: 📝 Generate Infracost Report
        run: |
          export INFRACOST_API_KEY=${{ secrets.INFRACOST_API_KEY }}
          cd ${{ inputs.working-directory }}
          infracost output --path /tmp/infracost.json --show-skipped --format html --out-file report.html

      - name: 📤 Upload current cost in artifactory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report.html
          path: ${{ inputs.working-directory }}/report.html

      - name: 💬 Post Infracost comment
        run: |
          export INFRACOST_API_KEY=${{ secrets.INFRACOST_API_KEY }}
          infracost comment github --path=/tmp/infracost.json \
                                   --repo=$GITHUB_REPOSITORY \
                                   --github-token=${{ secrets.GITHUB }} \
                                   --pull-request=${{ github.event.pull_request.number }} \
                                   --behavior=update

      - name: 📨 Generate Slack message
        id: infracost-slack
        run: |
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "slack-message<<${delimiter}"
            infracost output --path=/tmp/infracost.json --format=slack-message --show-skipped
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          echo "diffTotalMonthlyCost=$(jq '(.diffTotalMonthlyCost // 0) | tonumber' /tmp/infracost.json)" >> "$GITHUB_OUTPUT"

      - name: 🚀 Send cost estimate to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        if: ${{ inputs.slack_notification == 'true' }}
        with:
          payload: ${{ steps.infracost-slack.outputs.slack-message }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK}}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
...
