---
name: 🐳 Smurf-Docker

on:
  workflow_call:
    inputs:
      # ── General toggles ──────────────────────────────────────────────
      docker_enable:
        description: Set to true to run docker commands
        type: string
        required: false
      docker_push:
        description: Set true for docker push
        type: string
        required: false
      provider:
        description: Cloud provider (aws, azure, gcp, digitalocean)
        type: string
        required: false
        default: aws

      # ── Docker image & build ─────────────────────────────────────────
      docker_image_name:
        description: Docker image name
        type: string
        required: false
      docker_image_tag:
        description: Docker image tag
        type: string
        default: 'latest'
      docker_image_tar:
        description: Docker image tar
        type: string
        required: false
        default: image
      docker_registry:
        description: 'The registry to Push Docker Image (aws, az, gcp, hub)'
        type: string
        default: aws
      docker_registry_url:
        description: 'The URL of the container registry (e.g., Docker Hub, ECR, GCR, ACR).'
        type: string
      dockerfile_path:
        description: Docker file path (relative to repo root)
        type: string
        default: Dockerfile
      docker_build_args:
        description: Docker Build Arguments
        type: string
        required: false
        default: key1=val1
      docker_build_platform:
        description: Docker Image Build Platform
        type: string
        default: linux/amd64
      runs_on:
        description: Runner for the build job. Point this at an arm64 runner to
          build arm64 images natively instead of under emulation, which is
          several times faster.
        type: string
        required: false
        default: ubuntu-latest
      docker_buildkit_enable:
        description: Set true to enable docker buildkit
        type: string
        required: false
        default: 'false'

      # ── AWS ──────────────────────────────────────────────────────────
      aws_region:
        required: false
        type: string
        description: AWS Region
        default: 'us-east-1'
      aws_assume_role:
        description: Set to True to run Assume another IAM Role step
        required: false
        type: string
        default: 'false'
      aws_assume_role_arn:
        type: string
        description: AWS assume role
        required: false

      # ── GCP ──────────────────────────────────────────────────────────
      gcp_project_id:
        required: false
        type: string
        description: 'ID of the default project to use for future API calls and invocations.'
      gcp_auth_method:
        description: GCP auth method to use like wip and json
        type: string
        required: false
      gcp_docker_push:
        description: Set to True to Push Images in GCP
        type: string
        required: false
        default: 'false'

    secrets:
      # ── AWS secrets ──────────────────────────────────────────────────
      AWS_ACCESS_KEY_ID:
        required: false
        description: AWS Access Key ID for direct authentication
      AWS_SECRET_ACCESS_KEY:
        required: false
        description: AWS Secret Access Key for direct authentication
      AWS_SESSION_TOKEN:
        required: false
        description: AWS Session Token for direct authentication
      BUILD_ROLE:
        required: false
        description: AWS OIDC role for aws authentication

      # ── GCP secrets ──────────────────────────────────────────────────
      GCP_WIP:
        required: false
        description: 'WIP Connected with Service Account'
      GCP_SERVICE_ACCOUNT:
        required: false
        description: 'GCP service account'
      GOOGLE_CREDENTIALS:
        required: false
        description: 'GCP service account JSON Key'
      GCP_SERVICE_ACCOUNT_KEY:
        required: false
        description: 'GCP service account JSON Key'

      # ── Docker Hub secrets ───────────────────────────────────────────
      DOCKER_USERNAME:
        required: false
        description: Docker Hub username
      DOCKER_PASSWORD:
        required: false
        description: Docker Hub access token or password

      aws_set_parameters:
        required: false
        description: Overriding the default values using --set flag

jobs:
  ###############################################
  # BUILD → SAVE → UPLOAD ARTIFACT
  ###############################################
  docker_build:
    if: inputs.docker_enable == 'true'
    runs-on: ${{ inputs.runs_on }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@bcbebeb0d9ac2747befbe40c3b685a30dd48f1e6 # v1.1.6

      - name: 🧩 Register binfmt handlers for cross platform builds
        # Without a binfmt handler the runner cannot execute binaries for
        # another architecture, so `--platform linux/arm64` on an amd64 runner
        # pulls the right base image and then dies on the first RUN with
        # "exec format error". The build looks like a Dockerfile problem when
        # it is really a missing emulator.
        #
        # Skipped only when the requested platform is exactly the runner's
        # own, so a native build, which is the default and the common case,
        # is unaffected. An exact comparison rather than a substring one:
        # a multi platform value such as linux/amd64,linux/arm64 contains
        # the native platform but still needs an emulator for the rest.
        if: ${{ inputs.docker_build_platform != (runner.arch == 'X64' && 'linux/amd64' || 'linux/arm64') }}
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: 🐳 Docker Image Build
        if: inputs.docker_buildkit_enable != 'true'
        run: |
          smurf sdkr build ${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }} \
            -f ${{ inputs.dockerfile_path }} \
            --platform ${{ inputs.docker_build_platform }} \
            --build-arg ${{ inputs.docker_build_args }}

      - name: 🐳 Docker Image Build with Buildkit
        if: inputs.docker_buildkit_enable == 'true'
        run: |
          smurf sdkr build ${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }} \
            -f ${{ inputs.dockerfile_path }} \
            --platform ${{ inputs.docker_build_platform }} \
            --build-arg ${{ inputs.docker_build_args }} \
            --buildkit

      - name: 💾 Save Docker Image as Artifact
        run: |
          docker save ${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }} \
            -o ${{ inputs.docker_image_tar }}

      - name: 📤 Upload Docker Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: ${{ inputs.docker_image_tar }}

  ###############################################
  # DOWNLOAD → AUTH → SCAN → TAG → PUSH
  ###############################################
  docker_scan_push:
    if: inputs.docker_enable == 'true' && inputs.docker_push == 'true'
    runs-on: ubuntu-latest
    needs: docker_build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@bcbebeb0d9ac2747befbe40c3b685a30dd48f1e6 # v1.1.6

      - name: 📥 Download Docker Image Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: 📂 Load Docker Image
        run: docker load -i ${{ inputs.docker_image_tar }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Install AWS CLI
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 Assume another IAM role (Role Chaining)
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          role-chaining: true

      - name: ☁️ Authenticate Google Cloud with WIP and Service Account
        if: inputs.gcp_auth_method == 'wip'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WIP }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 300s
          project_id: ${{ inputs.gcp_project_id }}

      - name: ☁️ Authenticate Google Cloud with Service Account JSON Key
        if: inputs.gcp_auth_method == 'json'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}

      - name: 🐋 Set Docker Hub environment variables
        if: inputs.docker_registry == 'hub'
        run: |
          echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD }}" >> $GITHUB_ENV
        shell: bash

      # ── Scan & push ──────────────────────────────────────────────────
      - name: 🛡️ Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: 🔍 Docker Image Scan
        run: |
          smurf sdkr scan ${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }}

      - name: 🏷️ Docker Image Tag
        if: inputs.docker_push == 'true'
        run: |
          smurf sdkr tag ${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }} \
            ${{ inputs.docker_registry_url }}/${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }}

      - name: 🚀 Docker Image Push
        if: inputs.docker_push == 'true' && inputs.gcp_docker_push != 'true'
        run: |
          smurf sdkr push ${{ inputs.docker_registry }} ${{ inputs.docker_registry_url }}/${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }}

      - name: 🚀 Docker Image Push on GCP
        if: inputs.docker_push == 'true' && inputs.gcp_docker_push == 'true'
        run: |
          smurf sdkr push ${{ inputs.docker_registry }} \
            ${{ inputs.docker_registry_url }}/${{ inputs.docker_image_name }}:${{ inputs.docker_image_tag }} \
            --project-id ${{ inputs.gcp_project_id }}