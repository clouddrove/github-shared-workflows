---
name: ⎈ Smurf Helm Shared Workflow

on:
  workflow_call:
    inputs:
      # ── Cloud provider ───────────────────────────────────────────────
      provider:
        description: Cloud provider (aws, gcp, azure)
        type: string
        required: false
        default: aws
      target_environment:
        description: GitHub Environment name (empty = no gate)
        type: string
        required: false
        default: ""
      smurf_version:
        description: Smurf CLI version
        type: string
        required: false
        default: v1.1.5
      runs_on:
        description: GitHub Actions runner to use
        type: string
        required: false
        default: ubuntu-latest

      # ── Custom runner / package bootstrap ───────────────────────────
      devops_binary:
        description: "Comma-separated DevOps binaries to install when missing"
        type: string
        required: false
        default: ""

      additional_packages:
        description: "Comma-separated apt packages to install"
        type: string
        required: false
        default: ""

      # ── AWS ──────────────────────────────────────────────────────────
      aws_region:
        description: AWS region
        type: string
        required: false
        default: us-east-1
      aws_eks_cluster_name:
        description: AWS EKS cluster name
        type: string
        required: false
      aws_assume_role:
        description: Assume another IAM role after initial AWS auth
        type: boolean
        required: false
        default: false
      aws_assume_role_arn:
        description: IAM role ARN to assume
        type: string
        required: false

      # ── GCP ──────────────────────────────────────────────────────────
      gcp_project_id:
        description: GCP project ID
        type: string
        required: false
      gcp_region:
        description: GCP region
        type: string
        required: false
        default: us-central1
      gcp_gke_cluster_name:
        description: GKE cluster name
        type: string
        required: false

      # ── Helm toggles ─────────────────────────────────────────────────
      helm_enable:
        description: Run lint + deploy jobs
        type: boolean
        required: false
        default: false
      helm_rollback_enable:
        description: Run helm rollback job
        type: boolean
        required: false
        default: false

      # ── Helm chart & release ─────────────────────────────────────────
      helm_release_name:
        description: Helm release name
        type: string
        required: false
      helm_chart_directory:
        description: Path to Helm chart directory
        type: string
        required: false
      helm_values_file_path:
        description: Values file path (relative to repo root)
        type: string
        required: false
      helm_namespace:
        description: Kubernetes namespace
        type: string
        required: false
        default: default
      helm_revision:
        description: Revision number for rollback
        type: string
        required: false
      helm_timeout:
        description: Helm install/upgrade timeout (e.g. 5m, 300s)
        type: string
        required: false
        default: 5m
      helm_flags:
        description: Extra flags for helm upgrade --install
        type: string
        required: false
        default: "--atomic --wait --create-namespace"

      # ── Helm plugins & repos ─────────────────────────────────────────
      helm_plugin_install:
        description: Install Helm plugins before deploy
        type: boolean
        required: false
        default: false
      helm_plugins:
        description: Helm plugin install command args
        type: string
        required: false
      helm_repo_add:
        description: Add Helm repo before deploy
        type: boolean
        required: false
        default: false
      helm_repository:
        description: Helm repository name
        type: string
        required: false
      helm_repository_url:
        description: Helm repository URL
        type: string
        required: false

    secrets:
      # ── AWS secrets ──────────────────────────────────────────────────
      AWS_ACCESS_KEY_ID:
        required: false
        description: AWS access key (keys auth)
      AWS_SECRET_ACCESS_KEY:
        required: false
        description: AWS secret key (keys auth)
      AWS_SESSION_TOKEN:
        required: false
        description: AWS session token (optional)
      BUILD_ROLE:
        required: false
        description: AWS OIDC role ARN

      # ── GCP secrets ──────────────────────────────────────────────────
      GCP_CREDENTIALS:
        required: false
        description: GCP service account JSON key
      WORKLOAD_IDENTITY_PROVIDER:
        required: false
        description: GCP workload identity provider
      SERVICE_ACCOUNT:
        required: false
        description: GCP service account email (WIP auth)
      GCP_PROJECT_ID:
        description: 'GCP Project ID'
        required: false

      # ── Azure secrets ────────────────────────────────────────────────
      AZURE_CREDENTIALS:
        required: false
        description: Azure service principal JSON

      helm_extra_args:
        required: false
        description: Extra helm CLI args (e.g. --set key=val)

permissions:
  id-token: write
  contents: read

jobs:
  ###############################################
  # LINT → TEMPLATE
  ###############################################
  helm-lint:
    name: Helm Lint & Template
    if: ${{ inputs.helm_enable }}
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Install DevOps Binaries
        if: ${{ inputs.devops_binary != '' }}
        shell: bash
        run: |
          set -euo pipefail
          
          # ---------------------------------------------------------------
          # Detect architecture
          # ---------------------------------------------------------------
          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              AWS_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              AWS_ARCH="aarch64"
              ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          
          echo "Detected architecture: ${ARCH}"
          
          # ---------------------------------------------------------------
          # Install prerequisites once
          # ---------------------------------------------------------------
          NEED_APT_UPDATE=false
          
          command -v curl >/dev/null 2>&1 || NEED_APT_UPDATE=true
          command -v unzip >/dev/null 2>&1 || NEED_APT_UPDATE=true
          
          if [ "$NEED_APT_UPDATE" = true ]; then
            sudo apt-get update -y
          fi
          
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get install -y curl
          fi
          
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get install -y unzip
          fi
          
          # ---------------------------------------------------------------
          # Helper to install one binary
          # ---------------------------------------------------------------
          install_binary() {
            local name="$1"
            local version="${2:-}"
            local status=0
          
            echo "::group::Installing ${name}${version:+ (version ${version})}"
          
            # Disable errexit temporarily so we can ALWAYS close the group
            # before returning the actual installation status.
            set +e
          
            case "$name" in
          
              # -----------------------------------------------------------
              # AWS CLI
              # -----------------------------------------------------------
              awscli)
                if command -v aws >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "AWS CLI already present:"
                  aws --version
                else
                  if [ -z "$version" ]; then
                    echo "::error::AWS CLI version must be specified when installation is required."
                    status=1
                  else
                    curl -fsSL \
                      "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}-${version}.zip" \
                      -o /tmp/awscliv2.zip
              
                    if [ $? -eq 0 ]; then
                      unzip -q /tmp/awscliv2.zip -d /tmp
                      status=$?
              
                      if [ $status -eq 0 ]; then
                        sudo /tmp/aws/install --update
                        status=$?
                      fi
                    fi
              
                    rm -rf /tmp/aws /tmp/awscliv2.zip
              
                    if [ $status -eq 0 ]; then
                      aws --version
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # kubectl
              # -----------------------------------------------------------
              kubectl)
                if command -v kubectl >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "kubectl already present:"
                  kubectl version --client 2>/dev/null || true
                else
                  if [ -z "$version" ]; then
                    echo "::error::kubectl version must be specified when installation is required."
                    status=1
                  else
                    [[ "$version" != v* ]] && version="v${version}"
              
                    curl -fsSL \
                      "https://dl.k8s.io/release/${version}/bin/linux/${ARCH}/kubectl" \
                      -o /tmp/kubectl
              
                    status=$?
              
                    if [ $status -eq 0 ]; then
                      chmod +x /tmp/kubectl
                      sudo mv /tmp/kubectl /usr/local/bin/kubectl
                      status=$?
                    fi
              
                    if [ $status -eq 0 ]; then
                      kubectl version --client
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Helm
              # -----------------------------------------------------------
              helm)
                if command -v helm >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "Helm already present:"
                  helm version --short
                else
                  if [ -z "$version" ]; then
                    echo "::error::Helm version must be specified when installation is required."
                    status=1
                  else
                    [[ "$version" != v* ]] && version="v${version}"
              
                    curl -fsSL \
                      "https://get.helm.sh/helm-${version}-linux-${ARCH}.tar.gz" \
                      -o /tmp/helm.tar.gz
              
                    status=$?
              
                    if [ $status -eq 0 ]; then
                      tar -xzf /tmp/helm.tar.gz -C /tmp
                      status=$?
                    fi
              
                    if [ $status -eq 0 ]; then
                      sudo mv "/tmp/linux-${ARCH}/helm" /usr/local/bin/helm
                      status=$?
                    fi
              
                    sudo chmod +x /usr/local/bin/helm 2>/dev/null || true
              
                    rm -rf /tmp/helm.tar.gz "/tmp/linux-${ARCH}"
              
                    if [ $status -eq 0 ]; then
                      helm version --short
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Docker
              # -----------------------------------------------------------
              docker)
                if command -v docker >/dev/null 2>&1; then
                  echo "Docker already present:"
                  docker --version
                else
                  curl -fsSL https://get.docker.com | sudo sh
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    docker --version
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Terraform
              # -----------------------------------------------------------
              terraform)
                if command -v terraform >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "Terraform already present:"
                  terraform version | head -n 1
                else
                  if [ -z "$version" ]; then
                    echo "::error::Terraform version must be specified when installation is required."
                    status=1
                  else
                    curl -fsSL \
                      "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${ARCH}.zip" \
                      -o /tmp/terraform.zip
              
                    status=$?
              
                    if [ $status -eq 0 ]; then
                      unzip -q /tmp/terraform.zip -d /tmp/terraform
                      status=$?
                    fi
              
                    if [ $status -eq 0 ]; then
                      sudo mv /tmp/terraform/terraform /usr/local/bin/terraform
                      status=$?
                    fi
              
                    sudo chmod +x /usr/local/bin/terraform 2>/dev/null || true
              
                    rm -rf /tmp/terraform.zip /tmp/terraform
              
                    if [ $status -eq 0 ]; then
                      terraform version | head -n 1
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Azure CLI
              # -----------------------------------------------------------
              azurecli)
                if command -v az >/dev/null 2>&1; then
                  echo "Azure CLI already present:"
                  az version --output json | head -n 20
                else
                  curl -fsSL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    az version --output json | head -n 20
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # GitHub CLI
              # -----------------------------------------------------------
              ghcli)
                if command -v gh >/dev/null 2>&1; then
                  echo "GitHub CLI already present:"
                  gh --version | head -n 1
                else
                  sudo apt-get install -y gh
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    gh --version | head -n 1
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # jq
              # -----------------------------------------------------------
              jq)
                if command -v jq >/dev/null 2>&1; then
                  echo "jq already present:"
                  jq --version
                else
                  sudo apt-get install -y jq
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    jq --version
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # yq
              # -----------------------------------------------------------
              yq)
                if command -v yq >/dev/null 2>&1; then
                  echo "yq already present:"
                  yq --version
                else
                  curl -fsSL \
                    "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" \
                    -o /tmp/yq
              
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    chmod +x /tmp/yq
                    sudo mv /tmp/yq /usr/local/bin/yq
                    status=$?
                  fi
              
                  if [ $status -eq 0 ]; then
                    yq --version
                  fi
                fi
                ;;
              
              *)
                echo "::error::Unsupported DevOps binary: ${name}"
                echo "Supported binaries: awscli, helm, kubectl, docker, terraform, azurecli, ghcli, jq, yq"
                status=1
                ;;
              
            esac
              
            # Always close the GitHub Actions group.
            echo "::endgroup::"
              
            # Restore errexit.
            set -e
              
            return "$status"
          }
              
          # ---------------------------------------------------------------
          # Process requested binaries
          #
          # Format:
          #   awscli@2.27.25,kubectl@1.32.4,helm@3.17.3
          #
          # If no version is specified, the binary must already exist.
          # ---------------------------------------------------------------
          IFS=',' read -ra BINARIES <<< "${{ inputs.devops_binary }}"
          
          for binary in "${BINARIES[@]}"; do
            binary="$(echo "$binary" | xargs)"
            [ -z "$binary" ] && continue
          
            name="${binary%@*}"
            version=""
          
            if [[ "$binary" == *"@"* ]]; then
              version="${binary#*@}"
            fi
          
            install_binary "$name" "$version"
          done
          
          
      - name: 📦 Install Additional Packages
        if: ${{ inputs.additional_packages != '' }}
        shell: bash
        run: |
          set -euo pipefail
          
          # Update apt cache once for this step.
          sudo apt-get update -y
          
          IFS=',' read -ra PKGS <<< "${{ inputs.additional_packages }}"
          
          for pkg in "${PKGS[@]}"; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
          
            echo "::group::Installing apt package: ${pkg}"
          
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y "$pkg"
            else
              echo "::warning::Package '${pkg}' is not available through apt. Skipping."
            fi
          
            echo "::endgroup::"
          done

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.6
        with:
          version: ${{ inputs.smurf_version }}

      - name: 📚 Add Helm Chart Repo
        if: ${{ inputs.helm_repo_add }}
        run: |
          smurf selm repo add "${{ inputs.helm_repository }}" "${{ inputs.helm_repository_url }}"

      - name: 🔄 Update Helm Chart Repos
        if: ${{ inputs.helm_repo_add }}
        run: smurf selm repo update

      - name: ✅ Helm Lint
        run: |
          smurf selm lint "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}"

      - name: 📄 Helm Template
        run: |
          smurf selm template "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}"

  ###############################################
  # AUTH → KUBECONFIG → DEPLOY
  ###############################################
  helm-deploy:
    name: Helm Deploy
    if: ${{ inputs.helm_enable }}
    needs: helm-lint
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Install DevOps Binaries
