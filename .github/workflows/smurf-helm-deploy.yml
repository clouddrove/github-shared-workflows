            fi
          
            install_binary "$name" "$version"
          done
          
          
      - name: 📦 Install Additional Packages
        if: ${{ inputs.additional_packages != '' }}
        shell: bash
        run: |
          set -euo pipefail
          
          # Update apt cache once for this step.
          sudo apt-get update -y
          
          IFS=',' read -ra PKGS <<< "${{ inputs.additional_packages }}"
          
          for pkg in "${PKGS[@]}"; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
          
            echo "::group::Installing apt package: ${pkg}"
          
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y "$pkg"
            else
              echo "::warning::Package '${pkg}' is not available through apt. Skipping."
            fi
          
            echo "::endgroup::"
          done

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.6
        with:
          version: ${{ inputs.smurf_version }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Configure AWS credentials
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 Assume another IAM role
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: ☁️ Authenticate to Google Cloud
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ inputs.gcp_project_id }}

      - name: 🛠️ Set up gcloud SDK
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.gcp_project_id }}
          install_components: gke-gcloud-auth-plugin

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials \
            "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: 🔵 Login to Azure
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔧 Update kubeconfig (EKS)
        if: ${{ inputs.provider == 'aws' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.aws_eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      # ── Helm plugins & repos ─────────────────────────────────────────
      - name: 🔌 Helm Plugin
        if: ${{ inputs.helm_plugin_install }}
        run: smurf selm plugin ${{ inputs.helm_plugins }}

      - name: 📚 Add Helm Chart Repo
        if: ${{ inputs.helm_repo_add }}
        run: |
          smurf selm repo add "${{ inputs.helm_repository }}" "${{ inputs.helm_repository_url }}"

      - name: 🔄 Update Helm Chart Repos
        if: ${{ inputs.helm_repo_add }}
        run: smurf selm repo update

      - name: 🚀 Helm Deploy
        run: |
          smurf selm upgrade --install \
            "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}" \
            -n "${{ inputs.helm_namespace }}" \
            --timeout "${{ inputs.helm_timeout }}" \
            ${{ inputs.helm_flags }} \
            ${{ secrets.helm_extra_args }}

  ###############################################
  # AUTH → KUBECONFIG → ROLLBACK
  ###############################################
  helm-rollback:
    name: Helm Rollback
    if: ${{ inputs.helm_rollback_enable }}
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Install DevOps Binaries
        if: ${{ inputs.devops_binary != '' }}
        shell: bash
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # Detect architecture
          # ---------------------------------------------------------------
          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              AWS_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              AWS_ARCH="aarch64"
              ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          
          echo "Detected architecture: ${ARCH}"
          
          # ---------------------------------------------------------------
          # Install prerequisites once
          # ---------------------------------------------------------------
          NEED_APT_UPDATE=false
          
          command -v curl >/dev/null 2>&1 || NEED_APT_UPDATE=true
          command -v unzip >/dev/null 2>&1 || NEED_APT_UPDATE=true
          
          if [ "$NEED_APT_UPDATE" = true ]; then
            sudo apt-get update -y
          fi
          
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get install -y curl
          fi
          
          if ! command -v unzip >/dev/null 2>&1; then
            sudo apt-get install -y unzip
          fi
          
          # ---------------------------------------------------------------
          # Helper to install one binary
          # ---------------------------------------------------------------
          install_binary() {
            local name="$1"
            local version="${2:-}"
            local status=0
          
            echo "::group::Installing ${name}${version:+ (version ${version})}"
          
            # Disable errexit temporarily so we can ALWAYS close the group
            # before returning the actual installation status.
            set +e
          
            case "$name" in
          
              # -----------------------------------------------------------
              # AWS CLI
              # -----------------------------------------------------------
              awscli)
                if command -v aws >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "AWS CLI already present:"
                  aws --version
                else
                  if [ -z "$version" ]; then
                    echo "::error::AWS CLI version must be specified when installation is required."
                    status=1
                  else
                    curl -fsSL \
                      "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}-${version}.zip" \
                      -o /tmp/awscliv2.zip
              
                    if [ $? -eq 0 ]; then
                      unzip -q /tmp/awscliv2.zip -d /tmp
                      status=$?
              
                      if [ $status -eq 0 ]; then
                        sudo /tmp/aws/install --update
                        status=$?
                      fi
                    fi
              
                    rm -rf /tmp/aws /tmp/awscliv2.zip
              
                    if [ $status -eq 0 ]; then
                      aws --version
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # kubectl
              # -----------------------------------------------------------
              kubectl)
                if command -v kubectl >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "kubectl already present:"
                  kubectl version --client 2>/dev/null || true
                else
                  if [ -z "$version" ]; then
                    echo "::error::kubectl version must be specified when installation is required."
                    status=1
                  else
                    [[ "$version" != v* ]] && version="v${version}"
              
                    curl -fsSL \
                      "https://dl.k8s.io/release/${version}/bin/linux/${ARCH}/kubectl" \
                      -o /tmp/kubectl
              
                    status=$?
              
                    if [ $status -eq 0 ]; then
                      chmod +x /tmp/kubectl
                      sudo mv /tmp/kubectl /usr/local/bin/kubectl
                      status=$?
                    fi
              
                    if [ $status -eq 0 ]; then
                      kubectl version --client
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Helm
              # -----------------------------------------------------------
              helm)
                if command -v helm >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "Helm already present:"
                  helm version --short
                else
                  if [ -z "$version" ]; then
                    echo "::error::Helm version must be specified when installation is required."
                    status=1
                  else
                    [[ "$version" != v* ]] && version="v${version}"
              
                    curl -fsSL \
                      "https://get.helm.sh/helm-${version}-linux-${ARCH}.tar.gz" \
                      -o /tmp/helm.tar.gz
              
                    status=$?
              
                    if [ $status -eq 0 ]; then
                      tar -xzf /tmp/helm.tar.gz -C /tmp
                      status=$?
                    fi
              
                    if [ $status -eq 0 ]; then
                      sudo mv "/tmp/linux-${ARCH}/helm" /usr/local/bin/helm
                      status=$?
                    fi
              
                    sudo chmod +x /usr/local/bin/helm 2>/dev/null || true
              
                    rm -rf /tmp/helm.tar.gz "/tmp/linux-${ARCH}"
              
                    if [ $status -eq 0 ]; then
                      helm version --short
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Docker
              # -----------------------------------------------------------
              docker)
                if command -v docker >/dev/null 2>&1; then
                  echo "Docker already present:"
                  docker --version
                else
                  curl -fsSL https://get.docker.com | sudo sh
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    docker --version
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Terraform
              # -----------------------------------------------------------
              terraform)
                if command -v terraform >/dev/null 2>&1 && [ -z "$version" ]; then
                  echo "Terraform already present:"
                  terraform version | head -n 1
                else
                  if [ -z "$version" ]; then
                    echo "::error::Terraform version must be specified when installation is required."
                    status=1
                  else
                    curl -fsSL \
                      "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_${ARCH}.zip" \
                      -o /tmp/terraform.zip
              
                    status=$?
              
                    if [ $status -eq 0 ]; then
                      unzip -q /tmp/terraform.zip -d /tmp/terraform
                      status=$?
                    fi
              
                    if [ $status -eq 0 ]; then
                      sudo mv /tmp/terraform/terraform /usr/local/bin/terraform
                      status=$?
                    fi
              
                    sudo chmod +x /usr/local/bin/terraform 2>/dev/null || true
              
                    rm -rf /tmp/terraform.zip /tmp/terraform
              
                    if [ $status -eq 0 ]; then
                      terraform version | head -n 1
                    fi
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # Azure CLI
              # -----------------------------------------------------------
              azurecli)
                if command -v az >/dev/null 2>&1; then
                  echo "Azure CLI already present:"
                  az version --output json | head -n 20
                else
                  curl -fsSL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    az version --output json | head -n 20
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # GitHub CLI
              # -----------------------------------------------------------
              ghcli)
                if command -v gh >/dev/null 2>&1; then
                  echo "GitHub CLI already present:"
                  gh --version | head -n 1
                else
                  sudo apt-get install -y gh
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    gh --version | head -n 1
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # jq
              # -----------------------------------------------------------
              jq)
                if command -v jq >/dev/null 2>&1; then
                  echo "jq already present:"
                  jq --version
                else
                  sudo apt-get install -y jq
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    jq --version
                  fi
                fi
                ;;
              
              # -----------------------------------------------------------
              # yq
              # -----------------------------------------------------------
              yq)
                if command -v yq >/dev/null 2>&1; then
                  echo "yq already present:"
                  yq --version
                else
                  curl -fsSL \
                    "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" \
                    -o /tmp/yq
              
                  status=$?
              
                  if [ $status -eq 0 ]; then
                    chmod +x /tmp/yq
                    sudo mv /tmp/yq /usr/local/bin/yq
                    status=$?
                  fi
              
                  if [ $status -eq 0 ]; then
                    yq --version
                  fi
                fi
                ;;
              
              *)
                echo "::error::Unsupported DevOps binary: ${name}"
                echo "Supported binaries: awscli, helm, kubectl, docker, terraform, azurecli, ghcli, jq, yq"
                status=1
                ;;
              
            esac
              
            # Always close the GitHub Actions group.
            echo "::endgroup::"
              
            # Restore errexit.
            set -e
              
            return "$status"
          }
              
          # ---------------------------------------------------------------
          # Process requested binaries
          #
          # Format:
          #   awscli@2.27.25,kubectl@1.32.4,helm@3.17.3
          #
          # If no version is specified, the binary must already exist.
          # ---------------------------------------------------------------
          IFS=',' read -ra BINARIES <<< "${{ inputs.devops_binary }}"
          
          for binary in "${BINARIES[@]}"; do
            binary="$(echo "$binary" | xargs)"
            [ -z "$binary" ] && continue
          
            name="${binary%@*}"
            version=""
          
            if [[ "$binary" == *"@"* ]]; then
              version="${binary#*@}"
            fi
          
            install_binary "$name" "$version"
          done
          
          
      - name: 📦 Install Additional Packages
        if: ${{ inputs.additional_packages != '' }}
        shell: bash
        run: |
          set -euo pipefail
          
          # Update apt cache once for this step.
          sudo apt-get update -y
          
          IFS=',' read -ra PKGS <<< "${{ inputs.additional_packages }}"
          
          for pkg in "${PKGS[@]}"; do
            pkg="$(echo "$pkg" | xargs)"
            [ -z "$pkg" ] && continue
          
            echo "::group::Installing apt package: ${pkg}"
          
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              sudo apt-get install -y "$pkg"
            else
              echo "::warning::Package '${pkg}' is not available through apt. Skipping."
            fi
          
            echo "::endgroup::"
          done

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.6
        with:
          version: ${{ inputs.smurf_version }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Configure AWS credentials
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 Assume another IAM role
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: ☁️ Authenticate to Google Cloud
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ inputs.gcp_project_id }}

      - name: 🛠️ Set up gcloud SDK
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.gcp_project_id }}
          install_components: gke-gcloud-auth-plugin

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials \
            "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: 🔵 Login to Azure
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔧 Update kubeconfig (EKS)
        if: ${{ inputs.provider == 'aws' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.aws_eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: ⏪ Helm Rollback
        run: |
          smurf selm rollback "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_revision }}" \
            -n "${{ inputs.helm_namespace }}"
