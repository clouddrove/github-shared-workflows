---
name: ⎈ Smurf Helm Shared Workflow

on:
  workflow_call:
    inputs:
      # ── Cloud provider ───────────────────────────────────────────────
      provider:
        description: Cloud provider (aws, gcp, azure)
        type: string
        required: false
        default: aws
      target_environment:
        description: GitHub Environment name (empty = no gate)
        type: string
        required: false
        default: ""
      smurf_version:
        description: Smurf CLI version
        type: string
        required: false
        default: v1.1.5
      runs_on:
        description: GitHub Actions runner to use
        type: string
        required: false
        default: ubuntu-latest

      # ── Custom runner / package bootstrap ───────────────────────────
      devops_binary:
        description: "Comma-separated DevOps binaries to install when missing"
        type: string
        required: false
        default: ""

      # ── AWS ──────────────────────────────────────────────────────────
      aws_region:
        description: AWS region
        type: string
        required: false
        default: us-east-1
      aws_eks_cluster_name:
        description: AWS EKS cluster name
        type: string
        required: false
      aws_assume_role:
        description: Assume another IAM role after initial AWS auth
        type: boolean
        required: false
        default: false
      aws_assume_role_arn:
        description: IAM role ARN to assume
        type: string
        required: false

      # ── GCP ──────────────────────────────────────────────────────────
      gcp_project_id:
        description: GCP project ID
        type: string
        required: false
      gcp_region:
        description: GCP region
        type: string
        required: false
        default: us-central1
      gcp_gke_cluster_name:
        description: GKE cluster name
        type: string
        required: false

      # ── Helm toggles ─────────────────────────────────────────────────
      helm_enable:
        description: Run lint + deploy jobs
        type: boolean
        required: false
        default: false
      helm_rollback_enable:
        description: Run helm rollback job
        type: boolean
        required: false
        default: false

      # ── Helm chart & release ─────────────────────────────────────────
      helm_release_name:
        description: Helm release name
        type: string
        required: false
      helm_chart_directory:
        description: Path to Helm chart directory
        type: string
        required: false
      helm_values_file_path:
        description: Values file path (relative to repo root)
        type: string
        required: false
      helm_namespace:
        description: Kubernetes namespace
        type: string
        required: false
        default: default
      helm_revision:
        description: Revision number for rollback
        type: string
        required: false
      helm_timeout:
        description: Helm install/upgrade timeout (e.g. 5m, 300s)
        type: string
        required: false
        default: 5m
      helm_flags:
        description: Extra flags for helm upgrade --install
        type: string
        required: false
        default: "--atomic --wait --create-namespace"

      # ── Helm plugins & repos ─────────────────────────────────────────
      helm_plugin_install:
        description: Install Helm plugins before deploy
        type: boolean
        required: false
        default: false
      helm_plugins:
        description: Helm plugin install command args
        type: string
        required: false
      helm_repo_add:
        description: Add Helm repo before deploy
        type: boolean
        required: false
        default: false
      helm_repository:
        description: Helm repository name
        type: string
        required: false
      helm_repository_url:
        description: Helm repository URL
        type: string
        required: false

    secrets:
      # ── AWS secrets ──────────────────────────────────────────────────
      AWS_ACCESS_KEY_ID:
        required: false
        description: AWS access key (keys auth)
      AWS_SECRET_ACCESS_KEY:
        required: false
        description: AWS secret key (keys auth)
      AWS_SESSION_TOKEN:
        required: false
        description: AWS session token (optional)
      BUILD_ROLE:
        required: false
        description: AWS OIDC role ARN

      # ── GCP secrets ──────────────────────────────────────────────────
      GCP_CREDENTIALS:
        required: false
        description: GCP service account JSON key
      WORKLOAD_IDENTITY_PROVIDER:
        required: false
        description: GCP workload identity provider
      SERVICE_ACCOUNT:
        required: false
        description: GCP service account email (WIP auth)
      GCP_PROJECT_ID:
        description: 'GCP Project ID'
        required: false

      # ── Azure secrets ────────────────────────────────────────────────
      AZURE_CREDENTIALS:
        required: false
        description: Azure service principal JSON

      helm_extra_args:
        required: false
        description: Extra helm CLI args (e.g. --set key=val)

permissions:
  id-token: write
  contents: read

jobs:
  ###############################################
  # LINT → TEMPLATE
  ###############################################
  helm-lint:
    name: Helm Lint & Template
    if: ${{ inputs.helm_enable }}
    runs-on: ${{ inputs.runs_on }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.6
        with:
          version: ${{ inputs.smurf_version }}

      - name: 📚 Add Helm Chart Repo
        if: ${{ inputs.helm_repo_add }}
        run: |
          smurf selm repo add "${{ inputs.helm_repository }}" "${{ inputs.helm_repository_url }}"

      - name: 🔄 Update Helm Chart Repos
        if: ${{ inputs.helm_repo_add }}
        run: smurf selm repo update

      - name: ✅ Helm Lint
        run: |
          smurf selm lint "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}"

      - name: 📄 Helm Template
        run: |
          smurf selm template "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}"

  ###############################################
  # AUTH → KUBECONFIG → DEPLOY
  ###############################################
  helm-deploy:
    name: Helm Deploy
    if: ${{ inputs.helm_enable }}
    needs: helm-lint
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Install DevOps Binaries
        if: ${{ inputs.devops_binary == 'install' }}
        shell: bash
        run: |
          set -euo pipefail

          # Detect package manager
          if command -v apt-get >/dev/null 2>&1; then
            PKG_MANAGER="apt"
            echo "📦 Updating apt-get package lists..."
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y curl unzip tar gzip jq >/dev/null
          elif command -v yum >/dev/null 2>&1; then
            PKG_MANAGER="yum"
            echo "📦 Updating yum package lists..."
            sudo yum install -y curl unzip tar gzip jq >/dev/null
          else
            echo "::error::Unsupported package manager. Only apt and yum are supported."
            exit 1
          fi

          # Detect architecture
          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              AWS_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              AWS_ARCH="aarch64"
              ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          echo "⚙️  Package manager: ${PKG_MANAGER}"
          echo "⚙️  Architecture:    ${ARCH}"

          # ---------------------------------------------------------------
          # AWS CLI
          # ---------------------------------------------------------------
          echo "⬇️  Installing AWS CLI..."
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update >/dev/null
          rm -rf /tmp/aws /tmp/awscliv2.zip
          
          # ---------------------------------------------------------------
          # kubectl
          # ---------------------------------------------------------------
          echo "⬇️  Installing kubectl..."
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl" -o /tmp/kubectl
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          
          # ---------------------------------------------------------------
          # Helm
          # ---------------------------------------------------------------
          echo "⬇️  Installing Helm..."
          HELM_VERSION="v3.17.3"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv "/tmp/linux-${ARCH}/helm" /usr/local/bin/helm
          sudo chmod +x /usr/local/bin/helm
          rm -rf /tmp/helm.tar.gz "/tmp/linux-${ARCH}"
          
          # ---------------------------------------------------------------
          # Docker
          # ---------------------------------------------------------------
          echo "⬇️  Installing Docker..."
          curl -fsSL https://get.docker.com | sudo sh >/dev/null 2>&1
          
          # ---------------------------------------------------------------
          # Terraform
          # ---------------------------------------------------------------
          echo "⬇️  Installing Terraform..."
          TERRAFORM_VERSION="1.15.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_${ARCH}.zip" -o /tmp/terraform.zip
          unzip -q /tmp/terraform.zip -d /tmp/terraform
          sudo mv /tmp/terraform/terraform /usr/local/bin/terraform
          sudo chmod +x /usr/local/bin/terraform
          rm -rf /tmp/terraform.zip /tmp/terraform
          
          # ---------------------------------------------------------------
          # Azure CLI
          # ---------------------------------------------------------------
          echo "⬇️  Installing Azure CLI..."
          if [ "${PKG_MANAGER}" = "apt" ]; then
            curl -fsSL https://aka.ms/InstallAzureCLIDeb | sudo bash >/dev/null 2>&1
          else
            curl -fsSL https://aka.ms/InstallAzureCli | sudo bash >/dev/null 2>&1
          fi
          
          # ---------------------------------------------------------------
          # GitHub CLI
          # ---------------------------------------------------------------
          echo "⬇️  Installing GitHub CLI..."
          if [ "${PKG_MANAGER}" = "apt" ]; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y gh >/dev/null
          else
            sudo yum install -y 'dnf-command(config-manager)' >/dev/null 2>&1 || true
            sudo yum-config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo >/dev/null 2>&1
            sudo yum install -y gh >/dev/null
          fi
          
          # ---------------------------------------------------------------
          # yq
          # ---------------------------------------------------------------
          echo "⬇️  Installing yq..."
          curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" -o /tmp/yq
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          
          # ---------------------------------------------------------------
          # Clean and Visual Tool Verification Output
          # ---------------------------------------------------------------
          echo ""
          echo "========================================"
          echo "🔍 INSTALLED DEVOPS BINARIES"
          echo "========================================"

          TOOLS=(
            "AWS CLI|aws --version"
            "Helm|helm version --short"
            "Kubectl|kubectl version --client"
            "Docker|docker --version"
            "Terraform|terraform version | head -n 1"
            "Azure CLI|az version --output tsv --query '\"azure-cli\"'"
            "GitHub CLI|gh --version | head -n 1"
            "jq|jq --version"
            "yq|yq --version"
          )

          for TOOL in "${TOOLS[@]}"; do
            NAME="${TOOL%%|*}"
            CMD="${TOOL#*|}"
            
            echo "---"
            echo "$NAME"
            eval "$CMD" 2>&1 | sed 's/^/  /' || echo "  ⚠️ Execution failed"
          done
          echo "---"

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.6
        with:
          version: ${{ inputs.smurf_version }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Configure AWS credentials
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 AWS · Assume Chained IAM Role
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          role-session-name: ChainedRoleSession
          role-chaining: true

      - name: ☁️ Authenticate to Google Cloud
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ inputs.gcp_project_id }}

      - name: 🛠️ Set up gcloud SDK
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.gcp_project_id }}
          install_components: gke-gcloud-auth-plugin

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials \
            "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: 🔵 Login to Azure
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔧 Update kubeconfig (EKS)
        if: ${{ inputs.provider == 'aws' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.aws_eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      # ── Helm plugins & repos ─────────────────────────────────────────
      - name: 🔌 Helm Plugin
        if: ${{ inputs.helm_plugin_install }}
        run: smurf selm plugin ${{ inputs.helm_plugins }}

      - name: 📚 Add Helm Chart Repo
        if: ${{ inputs.helm_repo_add }}
        run: |
          smurf selm repo add "${{ inputs.helm_repository }}" "${{ inputs.helm_repository_url }}"

      - name: 🔄 Update Helm Chart Repos
        if: ${{ inputs.helm_repo_add }}
        run: smurf selm repo update

      - name: 🚀 Helm Deploy
        run: |
          smurf selm upgrade --install \
            "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_chart_directory }}" \
            -f "${{ inputs.helm_values_file_path }}" \
            -n "${{ inputs.helm_namespace }}" \
            --timeout "${{ inputs.helm_timeout }}" \
            ${{ inputs.helm_flags }} \
            ${{ secrets.helm_extra_args }}

  ###############################################
  # AUTH → KUBECONFIG → ROLLBACK
  ###############################################
  helm-rollback:
    name: Helm Rollback
    if: ${{ inputs.helm_rollback_enable }}
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.target_environment }}
    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v7

      - name: 🧰 Install DevOps Binaries
        if: ${{ inputs.devops_binary == 'install' }}
        shell: bash
        run: |
          set -euo pipefail

          # Detect package manager
          if command -v apt-get >/dev/null 2>&1; then
            PKG_MANAGER="apt"
            echo "📦 Updating apt-get package lists..."
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y curl unzip tar gzip jq >/dev/null
          elif command -v yum >/dev/null 2>&1; then
            PKG_MANAGER="yum"
            echo "📦 Updating yum package lists..."
            sudo yum install -y curl unzip tar gzip jq >/dev/null
          else
            echo "::error::Unsupported package manager. Only apt and yum are supported."
            exit 1
          fi

          # Detect architecture
          case "$(uname -m)" in
            x86_64)
              ARCH="amd64"
              AWS_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ARCH="arm64"
              AWS_ARCH="aarch64"
              ;;
            *)
              echo "::error::Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac

          echo "⚙️  Package manager: ${PKG_MANAGER}"
          echo "⚙️  Architecture:    ${ARCH}"

          # ---------------------------------------------------------------
          # AWS CLI
          # ---------------------------------------------------------------
          echo "⬇️  Installing AWS CLI..."
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${AWS_ARCH}.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update >/dev/null
          rm -rf /tmp/aws /tmp/awscliv2.zip
          
          # ---------------------------------------------------------------
          # kubectl
          # ---------------------------------------------------------------
          echo "⬇️  Installing kubectl..."
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl" -o /tmp/kubectl
          chmod +x /tmp/kubectl
          sudo mv /tmp/kubectl /usr/local/bin/kubectl
          
          # ---------------------------------------------------------------
          # Helm
          # ---------------------------------------------------------------
          echo "⬇️  Installing Helm..."
          HELM_VERSION="v3.17.3"
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-${ARCH}.tar.gz" -o /tmp/helm.tar.gz
          tar -xzf /tmp/helm.tar.gz -C /tmp
          sudo mv "/tmp/linux-${ARCH}/helm" /usr/local/bin/helm
          sudo chmod +x /usr/local/bin/helm
          rm -rf /tmp/helm.tar.gz "/tmp/linux-${ARCH}"
          
          # ---------------------------------------------------------------
          # Docker
          # ---------------------------------------------------------------
          echo "⬇️  Installing Docker..."
          curl -fsSL https://get.docker.com | sudo sh >/dev/null 2>&1
          
          # ---------------------------------------------------------------
          # Terraform
          # ---------------------------------------------------------------
          echo "⬇️  Installing Terraform..."
          TERRAFORM_VERSION="1.15.8"
          curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_${ARCH}.zip" -o /tmp/terraform.zip
          unzip -q /tmp/terraform.zip -d /tmp/terraform
          sudo mv /tmp/terraform/terraform /usr/local/bin/terraform
          sudo chmod +x /usr/local/bin/terraform
          rm -rf /tmp/terraform.zip /tmp/terraform
          
          # ---------------------------------------------------------------
          # Azure CLI
          # ---------------------------------------------------------------
          echo "⬇️  Installing Azure CLI..."
          if [ "${PKG_MANAGER}" = "apt" ]; then
            curl -fsSL https://aka.ms/InstallAzureCLIDeb | sudo bash >/dev/null 2>&1
          else
            curl -fsSL https://aka.ms/InstallAzureCli | sudo bash >/dev/null 2>&1
          fi
          
          # ---------------------------------------------------------------
          # GitHub CLI
          # ---------------------------------------------------------------
          echo "⬇️  Installing GitHub CLI..."
          if [ "${PKG_MANAGER}" = "apt" ]; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg 2>/dev/null
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -y >/dev/null
            sudo apt-get install -y gh >/dev/null
          else
            sudo yum install -y 'dnf-command(config-manager)' >/dev/null 2>&1 || true
            sudo yum-config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo >/dev/null 2>&1
            sudo yum install -y gh >/dev/null
          fi
          
          # ---------------------------------------------------------------
          # yq
          # ---------------------------------------------------------------
          echo "⬇️  Installing yq..."
          curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH}" -o /tmp/yq
          chmod +x /tmp/yq
          sudo mv /tmp/yq /usr/local/bin/yq
          
          # ---------------------------------------------------------------
          # Clean and Visual Tool Verification Output
          # ---------------------------------------------------------------
          echo ""
          echo "========================================"
          echo "🔍 INSTALLED DEVOPS BINARIES"
          echo "========================================"

          TOOLS=(
            "AWS CLI|aws --version"
            "Helm|helm version --short"
            "Kubectl|kubectl version --client"
            "Docker|docker --version"
            "Terraform|terraform version | head -n 1"
            "Azure CLI|az version --output tsv --query '\"azure-cli\"'"
            "GitHub CLI|gh --version | head -n 1"
            "jq|jq --version"
            "yq|yq --version"
          )

          for TOOL in "${TOOLS[@]}"; do
            NAME="${TOOL%%|*}"
            CMD="${TOOL#*|}"
            
            echo "---"
            echo "$NAME"
            eval "$CMD" 2>&1 | sed 's/^/  /' || echo "  ⚠️ Execution failed"
          done
          echo "---"

      - name: ⚙️ Setup Smurf
        uses: clouddrove/smurf@v1.1.6
        with:
          version: ${{ inputs.smurf_version }}

      # ── Cloud authentication ─────────────────────────────────────────
      - name: 🟦 Configure AWS credentials
        if: ${{ inputs.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          role-to-assume: ${{ secrets.BUILD_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          role-duration-seconds: 900
          role-skip-session-tagging: true

      - name: 🔑 AWS · Assume Chained IAM Role
        if: ${{ inputs.provider == 'aws' && inputs.aws_assume_role }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ inputs.aws_assume_role_arn }}
          role-session-name: ChainedRoleSession
          role-chaining: true

      - name: ☁️ Authenticate to Google Cloud
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}
          project_id: ${{ inputs.gcp_project_id }}

      - name: 🛠️ Set up gcloud SDK
        if: ${{ inputs.provider == 'gcp' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.gcp_project_id }}
          install_components: gke-gcloud-auth-plugin

      - name: 🔧 Update kubeconfig (GKE)
        if: ${{ inputs.provider == 'gcp' }}
        run: |
          gcloud container clusters get-credentials \
            "${{ inputs.gcp_gke_cluster_name }}" \
            --region "${{ inputs.gcp_region }}" \
            --project "${{ inputs.gcp_project_id }}"

      - name: 🔵 Login to Azure
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🔧 Update kubeconfig (EKS)
        if: ${{ inputs.provider == 'aws' }}
        run: |
          aws eks update-kubeconfig \
            --name "${{ inputs.aws_eks_cluster_name }}" \
            --region "${{ inputs.aws_region }}"

      - name: ⏪ Helm Rollback
        run: |
          smurf selm rollback "${{ inputs.helm_release_name }}" \
            "${{ inputs.helm_revision }}" \
            -n "${{ inputs.helm_namespace }}"
