---
name: 📖 Readme workflow
on:
  workflow_call:
    secrets:
      TOKEN:
        required: true
        description: 'GitHub Token.'
      SLACK_WEBHOOK_TERRAFORM:
        required: true
        description: 'Slack webhook url.'

jobs:
  readme-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: 🐍 Set up Python 3.7
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: 📝 Create readme
        uses: clouddrove/github-actions@8782c8d7d3c8e4c0cbca6eded77f36f284c2dc78 # v9.0.4
        with:
          actions_subcommand: 'readme'
          github_token: ${{ secrets.TOKEN }}

      - name: ✅ Pre-commit check errors
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true

      - name: 🛠️ Pre-commit fix errors
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true

      - name: 🚀 Push readme
        uses: clouddrove/github-actions@8782c8d7d3c8e4c0cbca6eded77f36f284c2dc78 # v9.0.4
        with:
          actions_subcommand: 'push'
          github_token: ${{ secrets.TOKEN }}

      - name: 📣 Slack Notification
        uses: clouddrove/action-slack@874218b8b8b4ffa08c76da3adfad30045de8ac9e # v2.5.0
        with:
          status: ${{ job.status }}
          fields: repo,author
          author_name: 'CloudDrove'
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_TERRAFORM }}
        if: always()
...